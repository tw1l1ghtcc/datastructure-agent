<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>成员06 · C包联调预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#202638;font:15px/1.65 "Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 4px}p{margin:6px 0 16px;color:#596174}section{background:white;border:1px solid #dce0eb;border-radius:12px;padding:18px;margin:16px 0}textarea{width:100%;height:124px;font:14px/1.5 monospace;resize:vertical;border:1px solid #bfc7d9;border-radius:6px;padding:10px}button,select{font:inherit;padding:7px 12px;margin:4px;border:1px solid #cbd1df;border-radius:6px;background:white}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#5242a4;color:white;border-color:#5242a4}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:4px}.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1.35fr);gap:18px}.viewport{overflow:auto;border:1px solid #e1e5ef;border-radius:6px;min-height:180px;max-height:480px}svg{display:block;min-width:100%}#code{overflow:auto;height:560px;font:12px/1.8 Consolas,monospace;padding-left:45px}#code li{white-space:pre;padding:0 6px}#code .active{background:#ebe6ff;box-shadow:inset 3px 0 #6046c0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace;max-height:360px;overflow:auto;background:#f6f7fb;padding:12px}#message{color:#a33427;min-height:25px}#seek{flex:1;min-width:130px}#description{font-weight:600;color:#3e3583}#position{white-space:nowrap}@media(max-width:760px){.grid{display:block}main{padding:12px}#code{height:250px}}
</style>
<main><h1>成员06 · C包联调预览</h1><p>使用真实算法轨迹与项目现有播放器。主工作台接入由01、02后续整合。</p>
<section><label>选择算法 <select id="algorithm" aria-label="选择算法"></select></label><button id="example">填入示例</button><button class="primary" id="run">生成步骤</button><textarea id="input" aria-label="JSON输入" spellcheck="false"></textarea><div id="message" role="status"></div>
<div class="controls"><button id="reset" disabled>重置</button><button id="prev" disabled>上一步</button><button id="play" disabled>播放</button><button id="next" disabled>下一步</button><button id="end" disabled>末步</button><input id="seek" type="range" min="0" max="0" value="0" aria-label="步骤时间轴" disabled><span id="position">尚未运行</span></div></section>
<div class="grid"><section><h2>展示源码</h2><p id="version">C / C++</p><ol id="code"></ol></section><section><h2>步骤与结构</h2><p id="description">选择算法并生成步骤。</p><div class="viewport" id="tree"></div><details open><summary>当前状态</summary><pre id="state"></pre></details><details><summary>最终结果</summary><pre id="result"></pre></details></section></div></main>
<script type="module">
import { createPlayback } from '/playback.js';
const $=id=>document.getElementById(id);let entries=[],run=null,player=null,controller=null,generation=0;
const ns='http://www.w3.org/2000/svg';
function el(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;}
function draw(v){
  $('tree').replaceChildren();if(!Array.isArray(v.nodes))return;
  const nodes=new Map(v.nodes.map(n=>[n.id,n]));const children=n=>n.children??[n.left,n.right].filter(x=>x!==null);
  const allChildren=new Set(v.nodes.flatMap(children));const roots=v.root!==undefined?(v.root===null?[]:[v.root]):v.nodes.filter(n=>!allChildren.has(n.id)).map(n=>n.id);
  const positions=new Map();let slot=0,maxDepth=0;
  function layout(id,depth){const n=nodes.get(id);if(!n||positions.has(id))return;maxDepth=Math.max(maxDepth,depth);const cs=children(n);for(const c of cs)layout(c,depth+1);const x=cs.length?cs.reduce((sum,c)=>sum+positions.get(c).x,0)/cs.length:80+slot++*160;positions.set(id,{x,y:45+depth*85});}
  for(const r of roots)layout(r,0);
  const svg=el('svg',{width:Math.max(500,slot*160+40),height:Math.max(160,maxDepth*85+100),role:'img','aria-label':'当前步骤树结构'});
  for(const n of v.nodes){const p=positions.get(n.id);if(!p)continue;for(const id of children(n)){const q=positions.get(id);svg.append(el('line',{x1:p.x,y1:p.y+17,x2:q.x,y2:q.y-17,stroke:'#a5adc0'}));}if(n.next!==null&&n.next!==undefined&&positions.has(n.next)){const q=positions.get(n.next);svg.append(el('path',{d:`M${p.x+55},${p.y+20}L${q.x-55},${q.y+20}`,stroke:'#3c9877','stroke-dasharray':'5 3'}));}}
  for(const n of v.nodes){const p=positions.get(n.id);if(!p)continue;const label=n.keys?n.keys.join(' | '):String(n.weight);const focus=v.currentNode===n.id||v.selected?.includes?.(n.id);const w=Math.max(100,Math.min(150,label.length*8+20));svg.append(el('rect',{x:p.x-w/2,y:p.y-18,width:w,height:36,rx:7,fill:focus?'#e5ddff':n.leaf?'#e8f7ef':'#f1f3f9',stroke:focus?'#6750ba':'#aab4c8'}));svg.append(el('text',{x:p.x,y:p.y+5,'text-anchor':'middle','font-size':13},label||'空'));svg.append(el('text',{x:p.x,y:p.y-24,'text-anchor':'middle','font-size':10,fill:'#777'},'节点 '+n.id));}
  $('tree').append(svg);
}
function clear(){generation++;controller?.abort();controller=null;player?.destroy();player=null;run=null;$('code').replaceChildren();$('tree').replaceChildren();$('state').textContent='';$('result').textContent='';$('position').textContent='尚未运行';$('description').textContent='选择算法并生成步骤。';for(const id of ['prev','next','play','reset','end','seek'])$(id).disabled=true;}
function render(s){if(!run||!s.step)return;const step=s.step;$('position').textContent=`第 ${s.stepIndex+1} / ${s.total} 步`;$('seek').value=s.stepIndex;$('prev').disabled=!s.canPrev;$('next').disabled=!s.canNext;$('play').disabled=!s.canNext&&!s.playing;$('play').textContent=s.playing?'暂停':'播放';$('description').textContent=step.description;$('state').textContent=JSON.stringify(step.variables,null,2);const code=$('code');for(const n of code.children)n.classList.toggle('active',n.dataset.lineId===step.lineId);const active=code.querySelector('.active');if(active){const box=code.getBoundingClientRect(),line=active.getBoundingClientRect();if(line.top<box.top)code.scrollTop+=line.top-box.top;else if(line.bottom>box.bottom)code.scrollTop+=line.bottom-box.bottom;}draw(step.variables);}
function fill(){clear();$('input').value=JSON.stringify(entries.find(e=>e.id===$('algorithm').value).example,null,2);$('message').textContent='';}
$('algorithm').onchange=fill;$('example').onclick=fill;$('input').oninput=()=>{clear();$('message').textContent='输入已更改，请重新生成步骤。';};
$('run').onclick=async()=>{clear();const ticket=generation;controller=new AbortController();$('run').disabled=true;try{const input=JSON.parse($('input').value);const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({algorithm:$('algorithm').value,input}),signal:controller.signal});const data=await res.json();if(!res.ok)throw new Error(data.error);if(ticket!==generation)return;run=data;$('code').replaceChildren(...run.sourceLines.map(l=>{const li=document.createElement('li');li.textContent=l.text;li.dataset.lineId=l.lineId;return li;}));$('version').textContent=run.sourceVersion;$('result').textContent=JSON.stringify(run.result,null,2);$('seek').max=run.steps.length-1;for(const id of ['reset','seek','end'])$(id).disabled=false;player=createPlayback({runId:run.runId,steps:run.steps,intervalMs:700,onStepChange:render});render({...player.getState(),step:run.steps[0]});$('message').textContent='';}catch(e){if(e.name!=='AbortError'&&ticket===generation)$('message').textContent=e.message;}finally{$('run').disabled=false;if(ticket===generation)controller=null;}};
$('next').onclick=()=>player?.next();$('prev').onclick=()=>player?.prev();$('reset').onclick=()=>player?.reset();$('end').onclick=()=>player?.seek(run.steps.length-1);$('play').onclick=()=>player?.getState().playing?player.pause():player?.play();$('seek').oninput=()=>player?.seek(Number($('seek').value));
window.addEventListener('pagehide',()=>{controller?.abort();player?.destroy();});
try{const res=await fetch('/api/algorithms');if(!res.ok)throw new Error('无法读取算法列表');entries=await res.json();for(const e of entries){const o=document.createElement('option');o.value=e.id;o.textContent=e.title;$('algorithm').append(o);}fill();}catch(e){$('message').textContent=e.message;}
</script></html>
